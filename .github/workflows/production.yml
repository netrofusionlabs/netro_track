name: NetroTrack Production Deploy

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/netrofusionlabs/netro_track-backend:production

jobs:
  build-and-deploy:
    name: Build and Deploy Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ---------------------------------------------------------
      # 1. Checkout production branch
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Login to GitHub Container Registry
      # ---------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. Build backend Docker image
      # ---------------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -t "$IMAGE_NAME" \
            .

      # ---------------------------------------------------------
      # 4. Push backend image to GHCR
      # ---------------------------------------------------------
      - name: Push backend image
        run: |
          docker push "$IMAGE_NAME"

      # ---------------------------------------------------------
      # 5. Configure SSH
      # ---------------------------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.GCP_VM_SSH_KEY }}' \
            > ~/.ssh/netrotrack_github_actions

          chmod 600 ~/.ssh/netrotrack_github_actions

          ssh-keyscan -H '${{ secrets.GCP_VM_HOST }}' \
            >> ~/.ssh/known_hosts

      # ---------------------------------------------------------
      # 6. Copy production Compose file to VM
      # ---------------------------------------------------------
      - name: Copy production Compose file
        run: |
          scp \
            -i ~/.ssh/netrotrack_github_actions \
            docker-compose.prod.yml \
            '${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:/opt/netrotrack/docker-compose.yml'

      # ---------------------------------------------------------
      # 7. Deploy on VM
      # ---------------------------------------------------------
      - name: Deploy to GCP VM
        run: |
          ssh \
            -i ~/.ssh/netrotrack_github_actions \
            '${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}' \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          cd /opt/netrotrack

          echo "Pulling latest NetroTrack backend image..."

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

          docker compose pull backend

          docker compose up -d postgres redis

          echo "Waiting for database and Redis..."

          sleep 10

          docker compose up -d backend

          echo "Deployment completed."

          docker compose ps

          REMOTE_SCRIPT