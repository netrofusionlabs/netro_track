name: NetroTrack Production Deploy

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/netrofusionlabs/netro_track-backend
  SSH_PORT: ${{ secrets.GCP_VM_SSH_PORT || '22' }}

jobs:
  build-and-deploy:
    name: Build and Deploy Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ---------------------------------------------------------
      # 1. Checkout production branch
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Login to GitHub Container Registry
      # ---------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. Build backend Docker image
      # ---------------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:production" \
            .

      # ---------------------------------------------------------
      # 4. Push backend image to GHCR
      # ---------------------------------------------------------
      - name: Push backend image
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:production"

      # ---------------------------------------------------------
      # 5. Configure SSH
      # ---------------------------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.GCP_VM_SSH_KEY }}' \
            > ~/.ssh/netrotrack_github_actions

          chmod 600 ~/.ssh/netrotrack_github_actions

          ssh-keyscan -p "$SSH_PORT" -H '${{ secrets.GCP_VM_HOST }}' \
            >> ~/.ssh/known_hosts

      # ---------------------------------------------------------
      # 6. Copy production Compose file to VM
      # ---------------------------------------------------------
      - name: Copy production Compose file
        run: |
          scp \
            -i ~/.ssh/netrotrack_github_actions \
            -P "$SSH_PORT" \
            docker-compose.prod.yml \
            '${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:/opt/netrotrack/docker-compose.yml'

      # ---------------------------------------------------------
      # 7. Create .env file on VM
      # ---------------------------------------------------------
      - name: Create .env on GCP VM
        run: |
          ssh \
            -i ~/.ssh/netrotrack_github_actions \
            -p "$SSH_PORT" \
            '${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}' \
            'bash -s' <<'REMOTE_SCRIPT'
            
          install -d -m 0700 /opt/netrotrack
          cd /opt/netrotrack
          cat <<EOF > .env
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          BACKEND_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
          LOG_LEVEL=info
          EOF
          REMOTE_SCRIPT

      # ---------------------------------------------------------
      # 8. Deploy on VM
      # ---------------------------------------------------------
      - name: Deploy to GCP VM
        run: |
          ssh \
            -i ~/.ssh/netrotrack_github_actions \
            -p "$SSH_PORT" \
            '${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}' \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          cd /opt/netrotrack

          echo "Pulling latest NetroTrack backend image..."

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

          docker compose pull backend

          docker compose up -d postgres redis

          echo "Waiting for database and Redis..."

          sleep 10

          docker compose up -d backend

          until curl --fail --silent --show-error http://127.0.0.1:3000/health; do
            sleep 2
          done

          echo "Deployment completed."

          docker compose ps

          REMOTE_SCRIPT
