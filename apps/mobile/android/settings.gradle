pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'com.netrotrack.app'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')

include ':react-native-community_geolocation'
project(':react-native-community_geolocation').projectDir = new File(rootProject.projectDir, '../../../node_modules/@react-native-community/geolocation/android')

include ':react-native-community_netinfo'
project(':react-native-community_netinfo').projectDir = new File(rootProject.projectDir, '../../../node_modules/@react-native-community/netinfo/android')

include ':react-native-maps'
project(':react-native-maps').projectDir = new File(rootProject.projectDir, '../../../node_modules/react-native-maps/android')

include ':react-native-vision-camera'
project(':react-native-vision-camera').projectDir = new File(rootProject.projectDir, '../../../node_modules/react-native-vision-camera/android')



